<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Управление сайтом · Сочи-центр</title>
<style>
:root{--bg:#14100D;--card:#221A14;--card2:#2A2019;--ink:#F3E9DC;--muted:rgba(243,233,220,.6);--line:rgba(243,233,220,.14);--ember:#E07A3F;--gold:#D9A66B;--ok:#6FCF97;--err:#F08A7E;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:96px}
.top{max-width:860px;margin:0 auto;padding:20px 16px 4px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.top h1{font-size:1.3rem;margin:0}
main{max-width:860px;margin:0 auto;padding:12px 16px 40px;display:grid;gap:28px}
h2{font-size:1.15rem;margin:0 0 4px}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 14px}
input{font:inherit;color:var(--ink);background:rgba(0,0,0,.3);border:1px solid rgba(243,233,220,.2);border-radius:12px;padding:10px 12px;width:100%;min-height:48px;min-width:0}
input:focus{outline:none;border-color:var(--ember);box-shadow:0 0 0 3px rgba(224,122,63,.22)}
input::placeholder{color:rgba(243,233,220,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:inherit;font-size:.95rem;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--ember)}
.btn.main{background:var(--ember);border-color:var(--ember);color:#1E1712}
.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;padding:4px 0;color:var(--muted);font:inherit;font-size:.85rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--err)}
/* услуги */
.svc{display:grid;gap:12px}
.it{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.pic{position:relative;width:112px;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1.5px dashed rgba(243,233,220,.28);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:.8rem;font-weight:600;cursor:pointer;padding:6px;background:rgba(0,0,0,.2)}
.pic:hover{border-color:var(--ember);color:var(--ink)}
.pic.has{border-style:solid;padding:0}
.pic img{width:100%;height:100%;object-fit:cover}
.pic.has span{position:absolute;left:0;right:0;bottom:0;padding:4px;background:rgba(0,0,0,.6);color:#fff;font-size:.72rem}
.flds{display:grid;gap:8px;align-content:start}
.flds .acts{display:flex;gap:16px;flex-wrap:wrap}
.add{width:100%;min-height:56px;border-style:dashed;background:transparent}
/* примеры работ */
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph figure{margin:0;position:relative;border-radius:14px;overflow:hidden;background:var(--card);aspect-ratio:4/5}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .del{position:absolute;top:8px;right:8px;min-height:34px;padding:0 12px;font-size:.8rem;background:rgba(20,16,13,.85)}
.ph .tag{position:absolute;left:8px;bottom:8px;font-size:.72rem;font-weight:600;background:rgba(20,16,13,.85);color:var(--gold);padding:3px 8px;border-radius:999px}
.ph .addph{border:1.5px dashed rgba(243,233,220,.3);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--muted);font-weight:600;cursor:pointer;background:transparent;font:inherit;aspect-ratio:4/5;border-radius:14px}
.ph .addph:hover{border-color:var(--ember);color:var(--ink)}
.ph .addph b{font-size:2rem;font-weight:400;line-height:1}
/* низ */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(20,16,13,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:860px;margin:0 auto;display:flex;gap:14px;align-items:center}
.bar .btn.main{flex:none;min-width:220px;min-height:52px;font-size:1rem}
.st{font-size:.9rem;color:var(--muted)}
.st.ok{color:var(--ok)}.st.err{color:var(--err)}.st.warn{color:var(--gold)}
@media(max-width:560px){.it{grid-template-columns:88px minmax(0,1fr)}.pic{width:88px}.bar .in{flex-direction:column-reverse;align-items:stretch;gap:6px}.bar .btn.main{width:100%}.st{text-align:center}}
</style>
</head><body>
<header class="top">
  <h1>Управление сайтом</h1>
  <a class="btn" href="../" target="_blank" rel="noopener">Открыть сайт</a>
</header>
<main>
<section>
  <h2>Услуги и цены</h2>
  <p class="hint">Нажмите на квадрат, чтобы добавить или заменить фото услуги. Цену пишите как на сайте, например «от 3 000 ₽». Без цены будет «цену уточняйте».</p>
  <div class="svc" id="svc"></div>
  <button class="btn add" id="add" type="button" style="margin-top:12px">+ Добавить услугу</button>
</section>
<section>
  <h2>Примеры работ</h2>
  <p class="hint">Первые три фото показываются на главном экране сайта.</p>
  <div class="ph" id="ph"></div>
</section>
</main>
<div class="bar"><div class="in">
  <button class="btn main" id="save" type="button">Сохранить изменения</button>
  <span class="st" id="st" aria-live="polite"></span>
</div></div>
<input type="file" id="file" accept="image/*" hidden>

<script>
(function(){
var $=function(id){return document.getElementById(id)};
var cfg={},svc=[],works=[],pending={},dirty=false,pick=null;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return ''}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function st(t,cls){$('st').textContent=t;$('st').className='st'+(cls?' '+cls:'')}
function src(p){return pending[p]||('../'+p)}
function mark(){dirty=true;st('Есть несохранённые изменения','warn')}

// Ключ доступа: разработчик один раз открывает владельцу ссылку admin/#key=...
var h=location.hash.match(/key=([^&]+)/);
if(h){ls('gh_token',decodeURIComponent(h[1]));history.replaceState(null,'',location.pathname)}
var host=location.hostname.match(/^([^.]+)\.github\.io$/i),seg=location.pathname.split('/').filter(Boolean);
var OWNER=host?host[1]:'',REPO=host?(seg[0]&&seg[0]!=='admin'?seg[0]:host[1]+'.github.io'):'';

// ---- Услуги ----
function drawSvc(){
  $('svc').innerHTML=svc.map(function(s,i){return '<div class="it" data-i="'+i+'">'+
    '<div class="pic'+(s.photo?' has':'')+'" data-a="photo" role="button" tabindex="0">'+(s.photo?'<img src="'+esc(src(s.photo))+'" alt=""><span>Заменить</span>':'+ Фото')+'</div>'+
    '<div class="flds"><input data-k="name" value="'+esc(s.name)+'" placeholder="Название услуги" aria-label="Название услуги">'+
    '<input data-k="price" value="'+esc(s.price)+'" placeholder="Цена" aria-label="Цена">'+
    '<div class="acts">'+(s.photo?'<button class="link" data-a="nophoto" type="button">Убрать фото</button>':'')+'<button class="link" data-a="del" type="button">Удалить услугу</button></div></div></div>'}).join('');
}
$('svc').addEventListener('input',function(e){var it=e.target.closest('.it');if(!it||!e.target.dataset.k)return;svc[+it.dataset.i][e.target.dataset.k]=e.target.value;mark()});
$('svc').addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var i=+b.closest('.it').dataset.i;
  if(b.dataset.a==='photo'){pick={svc:i};$('file').click();return}
  if(b.dataset.a==='nophoto'){svc[i].photo='';drawSvc();mark();return}
  if(b.dataset.a==='del'){if(!confirm('Удалить услугу «'+(svc[i].name||'без названия')+'»?'))return;svc.splice(i,1);drawSvc();mark()}});
$('svc').addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.classList.contains('pic'))e.target.click()});
$('add').onclick=function(){svc.push({name:'',price:'',photo:''});drawSvc();mark();$('svc').lastElementChild.querySelector('input').focus()};

// ---- Примеры работ ----
function drawWorks(){
  $('ph').innerHTML=works.map(function(p,i){return '<figure data-i="'+i+'"><img src="'+esc(src(p))+'" alt="Работа '+(i+1)+'">'+(i<3?'<span class="tag">Главный экран</span>':'')+'<button class="btn del" type="button">Удалить</button></figure>'}).join('')+
    '<button class="addph" id="addph" type="button"><b>+</b>Добавить фото</button>';
}
$('ph').addEventListener('click',function(e){
  if(e.target.closest('#addph')){pick={works:true};$('file').multiple=true;$('file').click();return}
  var b=e.target.closest('.del');if(!b)return;if(!confirm('Удалить это фото с сайта?'))return;
  works.splice(+b.closest('figure').dataset.i,1);drawWorks();mark()});

// ---- Выбор и сжатие фото ----
function shrink(file){return new Promise(function(res,rej){
  var img=new Image(),u=URL.createObjectURL(file);
  img.onload=function(){var k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.85))};
  img.onerror=function(){rej()};img.src=u})}
$('file').onchange=function(){
  var files=[].slice.call(this.files).filter(function(f){return /^image\//.test(f.type)}),p=pick;this.value='';this.multiple=false;pick=null;
  if(!files.length||!p)return;
  st('Обрабатываем фото…');
  Promise.all(files.map(shrink)).then(function(list){
    list.forEach(function(data,k){var path='img/u'+Date.now()+'-'+k+'.jpg';pending[path]=data;
      if(p.works)works.push(path);else if(k===0)svc[p.svc].photo=path});
    drawSvc();drawWorks();mark();
  }).catch(function(){st('Не удалось открыть фото. Попробуйте другое.','err')});
};

// ---- Загрузка ----
fetch('../config.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(c){
  cfg=c||{};
  svc=(cfg.services||[]).map(function(s){return typeof s==='string'?{name:s,price:'',photo:''}:{name:s.name||'',price:s.price||'',photo:s.photo||''}});
  works=(cfg.photos||[]).slice();
  drawSvc();drawWorks();
}).catch(function(){st('Не удалось загрузить данные сайта. Обновите страницу.','err')});

// ---- Сохранение ----
function api(path,method,body){
  return fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path,{method:method||'GET',cache:'no-store',headers:{'Authorization':'Bearer '+ls('gh_token'),'Accept':'application/vnd.github+json'},body:body?JSON.stringify(body):undefined})
    .then(function(x){if(method!=='PUT'&&x.status===404)return {};return x.json().then(function(j){if(!x.ok){var e=new Error(j.message||x.status);e.code=x.status;throw e}return j})});
}
function put(path,b64,msg){return api(path).then(function(cur){return api(path,'PUT',{message:msg,content:b64,sha:cur.sha})})}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}

$('save').onclick=function(){
  if(!ls('gh_token')||!OWNER){st('Сохранение не подключено. Попросите разработчика прислать ссылку для входа.','err');return}
  var clean=svc.map(function(s){return {name:s.name.trim(),price:s.price.trim(),photo:s.photo||''}}).filter(function(s){return s.name});
  if(!clean.length){st('Добавьте хотя бы одну услугу.','err');return}
  var used=works.concat(clean.map(function(s){return s.photo})).filter(function(p){return p&&pending[p]});
  var btn=$('save');btn.disabled=true;
  var n=0;st(used.length?'Загружаем фото 0 из '+used.length+'…':'Сохраняем…');
  used.reduce(function(p,path){return p.then(function(){return put(path,pending[path].split(',')[1],'Сайт: новое фото').then(function(){delete pending[path];n++;st('Загружаем фото '+n+' из '+used.length+'…')})})},Promise.resolve())
  .then(function(){cfg.services=clean;cfg.photos=works.slice();st('Сохраняем…');return put('config.json',b64(JSON.stringify(cfg,null,2)+'\n'),'Сайт: услуги, цены и фото')})
  .then(function(){svc=clean;dirty=false;st('Сохранено. На сайте изменения появятся через 1–2 минуты.','ok')})
  .catch(function(e){st(e.code===401||e.code===403||e.code===404?'Доступ к сохранению устарел. Попросите разработчика прислать новую ссылку для входа.':'Не получилось сохранить. Проверьте интернет и попробуйте ещё раз.','err')})
  .then(function(){btn.disabled=false});
};
addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue=''}});
})();
</script>
</body></html>
